<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Kiểm tra giao diện AGRIDELTA</title>
<style>
  body { margin:0; background:#e5eadd; font:13px system-ui; color:#15372b; }
  header { display:flex; gap:8px; padding:12px; align-items:center; flex-wrap:wrap; }
  button { padding:8px 10px; background:white; border:1px solid #aab3a5; cursor:pointer; }
  iframe { margin:0 12px; border:0; display:block; background:white; }
</style>
<header><b>AGRIDELTA · Responsive QA</b><div id="sizes"></div><span id="metrics"></span></header>
<iframe id="preview" title="Bản xem thử AGRIDELTA" src="/" width="390" height="844"></iframe>
<script>
  const preview = document.querySelector('#preview');
  const sizes = [320,360,390,430,768,1024,1440,1920,844];
  for (const width of sizes) {
    const button = document.createElement('button');
    button.textContent = width === 844 ? '844 × 390' : width + ' px';
    button.onclick = () => {
      preview.width = width;
      preview.height = width === 844 ? 390 : width < 800 ? 844 : 950;
      requestAnimationFrame(measure);
    };
    document.querySelector('#sizes').append(button);
  }
  function measure() {
    const doc = preview.contentDocument?.documentElement;
    if (!doc) return;
    document.querySelector('#metrics').textContent = doc.clientWidth + ' / ' + doc.scrollWidth + ' px';
  }
  preview.addEventListener('load',measure);
  setInterval(measure,750);
</script>
</html>
