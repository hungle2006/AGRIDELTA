name: Generate detailed living seedling GLB
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/refine-seedling.yml'
      - 'enhance_seedling_model.py'
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install geometry dependencies
        run: python -m pip install 'trimesh>=4.4,<5' 'numpy>=1.26,<3'
      - name: Build detailed seedling
        run: python enhance_seedling_model.py
      - name: Commit rendered mesh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/agridelta_seed_to_harvest_model.glb
          if ! git diff --cached --quiet; then
            git commit -m 'assets: refine 3D seedling geometry, veins, dew and root filaments'
            git push
          fi
