name: Bootstrap verified 3D assets
on:
  push:
    paths:
      - '.github/workflows/bootstrap-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Retrieve immutable release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets
          curl -fsSL --retry 3 --retry-all-errors --max-time 120 'https://agridelta-peoed91d9-hope-1091.vercel.app/assets/agridelta_seed_to_harvest_model.glb' -o public/assets/agridelta_seed_to_harvest_model.glb
          curl -fsSL --retry 3 --retry-all-errors --max-time 120 'https://agridelta-peoed91d9-hope-1091.vercel.app/assets/harvest-hero.webp' -o public/assets/harvest-hero.webp
          echo '3a12391a9adc0553da8449496cdec3e342cf5991234fd6db3754acb8fe8849ae  public/assets/agridelta_seed_to_harvest_model.glb' | sha256sum --check --status
          echo 'd765fc4699b302ce9d755a4d3f8b2bc0028ba6c7b2d8bdcb4b73abc91a311f72  public/assets/harvest-hero.webp' | sha256sum --check --status
      - name: Commit verified assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/
          if ! git diff --cached --quiet; then
            git commit -m 'assets: import verified 3D model and harvest image'
            git push
          fi
